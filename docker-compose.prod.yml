services:
  api:
    image: cpr-api:prod
    build:
      context: ./api
      dockerfile: Dockerfile
    ports:
      - "${API_PORT:-5125}:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lectora}
      WHISPER_URL: http://whisper:8000
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_started
    restart: unless-stopped

  whisper:
    image: cpr-whisper:prod
    build:
      context: ./whisper
      dockerfile: Dockerfile
    restart: unless-stopped
    volumes:
      - ./whisper/models:/models
    environment:
      OMP_NUM_THREADS: "4"
      WHISPER_MODEL: "auto"

  convert:
    build:
      context: ./whisper/convert
    profiles: ["setup"]
    volumes:
      - ./whisper/models:/models

  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lectora}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
