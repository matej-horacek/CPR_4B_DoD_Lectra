services:  
  api:
    container_name: lectora-api
    image: cpr-api:dev
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    ports:
      - "${API_PORT:-5125}:8080"
    volumes:
      - ./api:/src
      - /src/bin
      - /src/obj
      - ./data:/var/recordings
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      POSTGRES_HOST: lectora-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lectora}
      WHISPER_URL: http://lectora-whisper:8000
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_started
    networks:
      - lectora-db

  whisper:
    container_name: lectora-whisper
    image: cpr-whisper:dev
    build:
      context: ./whisper
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${WHISPER_PORT:-8000}:8000"
    volumes:
      - ./whisper/models:/models
    environment:
      OMP_NUM_THREADS: "4"
      WHISPER_MODEL: "auto"
    networks:
      - lectora-db

  convert:
    build:
      context: ./whisper/convert
    profiles: ["setup"]
    user: "${HOST_UID:-0}:${HOST_GID:-0}"
    volumes:
      - ./whisper/models:/models

  postgres:
    container_name: lectora-postgres
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-lectora}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - lectora-db

volumes:
  postgres_data:

networks:
  lectora-db:
    driver: bridge
